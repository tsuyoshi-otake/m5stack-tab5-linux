name: static-check
on:
  push:
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Rootfs script checks
        run: sh tests/static-check.sh
      - name: Secret scan
        run: python3 tools/check-no-secrets.py
      - name: Host tests
        run: sh linux/tests/run-host-tests.sh
