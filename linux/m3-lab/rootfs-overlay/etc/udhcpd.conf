# /etc/udhcpd.conf - BusyBox udhcpd configuration for M5Stamp P4 SoftAP
# The AP has no uplink and no DNS server, but it hands itself out as router
# and DNS server anyway: Android treats an IPv4 lease without a default route
# and a DNS server as not provisioned (LinkProperties.isIpv4Provisioned) and
# fails the connection, which showed up as a phone stuck on "connecting" (#4).
# A client with another network keeps preferring that one by route metric; a
# phone marks this network "no internet" and stays on mobile data.
start 192.168.4.2
end 192.168.4.20
interface wlan0
max_leases 10
lease_file /run/udhcpd.leases
opt subnet 255.255.255.0
opt lease 3600
opt router 192.168.4.1
opt dns 192.168.4.1
